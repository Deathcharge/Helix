name: Deploy API Documentation to GitHub Pages

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Pages
        uses: actions/configure-pages@v4
      
      - name: Build API documentation site
        run: |
          mkdir -p docs
          
          # Create comprehensive API documentation page
          cat > docs/index.html << 'HTML_EOF'
<!DOCTYPE html>
<html lang="en">
