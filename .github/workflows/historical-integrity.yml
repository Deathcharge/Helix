name: Historical integrity

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install historical dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest pytest-asyncio pip-audit
      - name: Compile source
        run: >-
          python -m compileall -q
          agents.py agents_loop.py backend context_manager.py discord_bot_manus.py
          main.py operations streamlit_app.py ucf_protocol.py z88_ritual_engine.py
      - name: Run surviving tests
        run: python -m pytest -q
      - name: Audit dependencies
        run: python -m pip_audit -r requirements.txt
